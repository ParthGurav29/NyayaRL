
# NyayaRL Training Configuration
# ─────────────────────────────────

# Training loop
total_train_steps: 2000
eval_every: 500
eval_episodes: 50
checkpoint_every: 500

# Paths
checkpoint_dir: "checkpoints"
log_dir: "logs"

# GRPO
G: 16
lr: 0.001
clip_epsilon: 0.2
entropy_coef: 0.05
entropy_coef_final: 0.01
entropy_anneal_steps: 10000

# Curriculum
window_size: 100
promotion_threshold: 0.6
